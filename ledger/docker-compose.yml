services:
  db:
    image: postgres:16              # official Postgres image, version pinned
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger           # database name Django will connect to
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledgerpass # fine for local dev only
    ports:
      - "5432:5432"                 # expose Postgres on localhost:5432
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data   # data survives container restarts

volumes:
  ledger_pgdata: